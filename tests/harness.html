<script>
  // ==== 模拟站点行为（真机实测：站点在 document 捕获阶段对 click 调 preventDefault()）====
  // 保证"面板控件不得依赖浏览器默认动作"这条不回归：原生 checkbox 在这种环境下点不动。
  document.addEventListener('click', (e) => { e.preventDefault(); }, true);

<script>
try { localStorage.removeItem('iirose_blacklist_v1'); } catch (e) {}
window.uid = 'myown0000001a';                 // 站点在 iframe 上挂的 window.uid（自己的 uid）

const BLOCK = 'block0000005e', OTHER = 'other0000006f', RIGHT = 'right00000070';
const OLD = 'old000000002b', PMOLD = 'pmold0000003c', KEEP = 'keep00000004d';
window.__IDS = { BLOCK, OTHER, RIGHT, OLD, PMOLD, KEEP };

// 假 socket：站点自己会把回调挂在 _onmessage 上
window.__RECV = [];
window.socket = {
  _onmessage: function (data) { window.__RECV.push(data); },
  _send: function () { },

  readyState: 1,
};

// 帧样本（格式取自官方文档；uid 用真实形态的 13 位小写字母数字）
window.__FRAMES = {
  room3: '"1700000001>http://av/1.jpg>甲>AAA>040b02>040b02>1>>' + OTHER + '>g>111'
    + '<1700000002>http://av/2.jpg>乙>BBB>040b02>040b02>1>>' + BLOCK + '>g>222',
  priv2: '""1700000101>' + BLOCK + '>乙>http://av/2.jpg>secret>339f88>>339f88>3>http://bg/1.png>333'
    + '<1700000102>' + OTHER + '>甲>http://av/1.jpg>hi>339f88>>339f88>3>http://bg/2.png>444',
  danmaku: '=乙>danmaku>040b02>040b02>1>http://av/1.jpg>1700000003>' + BLOCK + '>g>2325>f590',

  // 信箱（通知）帧：'@' + 子类型字符，记录以 '<' 分、字段以 '>' 分

  mailRec: (name, avatar, marker, extra) => [name, avatar, '2', "'" + marker + (extra || ''), '', '1762613079', 'd28ad2'].join('>'),
  mailLike: (name, avatar) => '@*' + [name, avatar, '2', "'*", '', '1762613079', 'd28ad2'].join('>'),
  mailFollower: (name, avatar) => '@*' + [name, avatar, '2', "'^", '', '1762613079', 'd28ad2'].join('>'),
  mailPayment: (name, avatar) => '@*' + [name, avatar, '2', "'$1 谢谢", '', '1762613079', 'd28ad2'].join('>'),
  mailNotice: (text) => '@*' + [text, 'bg.png', '1762613000'].join('>'),
  roomOne: (uid, name, avatar) => '"1700000009>' + avatar + '>' + name + '>hi>040b02>040b02>1>>' + uid + '>g>111',

<!-- 加载真实插件（被测对象），不做任何改写；带时间戳绕开浏览器缓存，避免测到旧版 -->
<script>document.write('<script src="../src/iirose-blacklist.js?t=' + Date.now() + '"><\/script>');</script>

<script>
const F = window.__FRAMES, ID = window.__IDS;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const results = [];
function t(name, fn) { return Promise.resolve().then(fn).then(() => { results.push({ name, ok: true }); }, (e) => { results.push({ name, ok: false, err: String((e && e.message) || e) }); }); }
function ok(v, m) { if (!v) throw new Error(m || '断言失败'); }
function eq(a, b, m) { if (a !== b) throw new Error((m || 'eq') + ' 期望=' + JSON.stringify(b) + ' 实际=' + JSON.stringify(a)); }

// 找到某个面板里、文字匹配的“最内层”元素（避免点到外层容器，之前的误报就是这么来的）
function innermost(matcher, root) {
  const all = Array.from((root || document).querySelectorAll('div,button'));
  const hit = all.filter((e) => matcher(e));
  return hit.find((e) => !hit.some((o) => o !== e && e.contains(o))) || hit[0] || null;
}
// 真实点击手势：mousedown → mouseup → click（和浏览器发出来的顺序一致）
function realClick(node) {
  const opts = { bubbles: true, cancelable: true, view: window };
  node.dispatchEvent(new MouseEvent('mousedown', opts));
  node.dispatchEvent(new MouseEvent('mouseup', opts));
  node.dispatchEvent(new MouseEvent('click', opts));
}
// 指针捕获的忠实模型：真浏览器里 setPointerCapture 之后，pointerup 与"兼容鼠标"事件
// 都会重定向到捕获元素 —— 被按下的子元素只收得到那一下 pointerdown。
// 合成事件不会自动重定向，所以这里拦截 API 记录捕获者，再按同样规则派发。
const CAPTURE = { el: null };
(function patchCapture() {
  if (!window.Element || !Element.prototype.setPointerCapture) return;
  Element.prototype.setPointerCapture = function () { CAPTURE.el = this; };
  Element.prototype.releasePointerCapture = function () { if (CAPTURE.el === this) CAPTURE.el = null; };
})();
function capturedGesture(pressNode) {
  const o = { bubbles: true, cancelable: true, view: window, clientX: 0, clientY: 0, button: 0, buttons: 1 };
  const P = (t, n) => { if (window.PointerEvent) n.dispatchEvent(new PointerEvent(t, Object.assign({ pointerId: 1, pointerType: 'mouse', isPrimary: true }, o))); };
  CAPTURE.el = null;
  P('pointerdown', pressNode);                 // 只有这一下必然到得了子元素
  pressNode.dispatchEvent(new MouseEvent('mousedown', o));
  const target = CAPTURE.el || pressNode;      // 被捕获了 → 后续都归捕获元素；没捕获 → 归原子元素
  P('pointerup', target);
  target.dispatchEvent(new MouseEvent('mouseup', o));
  target.dispatchEvent(new MouseEvent('click', o));
  CAPTURE.el = null;
}
// 面板本体 = 从「已拉黑 (N)」那个标题往上找到的第一个 position:fixed 容器
// （v0.3.14 起标题被包进了 tab 分组 div，不能再拿 parentElement 当面版本体）
function panel() {
  const h = innermost((e) => /^已拉黑 \(\d+\)$/.test(e.textContent || ''));
  if (!h) return null;
  let n = h;
  while (n && n !== document.body && !(n.style && n.style.position === 'fixed')) n = n.parentElement;
  return (n && n !== document.body) ? n : null;
}

async function run() {
  const A = window.__IIROSE_BLACKLIST__;
  ok(A, '插件未加载：window.__IIROSE_BLACKLIST__ 不存在');

  await t('W1 版本标记存在（区分"没加载/旧版"）', () => { eq(window.__IIROSE_BLACKLIST_VERSION__, A.version); });
  await t('W2 socket._onmessage 已被挂载', () => { eq(A.hooked, true); });
  await t('W3 链路活着：无关帧原样到达', () => {
    window.__RECV.length = 0;
    const m = '&1{"s":"//m.mp3","b":"@0"}';
    window.socket._onmessage(m);
    eq(window.__RECV[0], m);
  });
  await t('W4 拉黑前房间帧原样到达', () => {
    window.__RECV.length = 0; window.socket._onmessage(F.room3); eq(window.__RECV[0], F.room3);
  });
  await t('W5 拉黑后：房间帧里该用户记录消失、他人记录保留且顺序不变', () => {
    A.block(ID.BLOCK, '乙');
    eq(A.isBlocked(ID.BLOCK), true);
    window.__RECV.length = 0; window.socket._onmessage(F.room3);
    eq(window.__RECV.length, 1);
    ok(window.__RECV[0].indexOf(ID.BLOCK) < 0, '记录未剔除：' + window.__RECV[0]);
    ok(window.__RECV[0].indexOf(ID.OTHER) > 0, '他人记录被误删');
    eq(window.__RECV[0], '"1700000001>http://av/1.jpg>甲>AAA>040b02>040b02>1>>' + ID.OTHER + '>g>111');
  });
  await t('W6 私聊帧里被拉黑者记录消失、他人保留', () => {
    window.__RECV.length = 0; window.socket._onmessage(F.priv2);
    eq(window.__RECV.length, 1);
    ok(window.__RECV[0].indexOf(ID.BLOCK) < 0, '私聊未屏蔽：' + window.__RECV[0]);
    ok(window.__RECV[0].indexOf(ID.OTHER) > 0, '他人私聊被误删');
  });
  await t('W7 弹幕帧被整帧丢弃', () => {
    window.__RECV.length = 0; window.socket._onmessage(F.danmaku); eq(window.__RECV.length, 0);
  });
  await t('W8 不能拉黑自己', () => {
    A.block('myown0000001a', '我');
    eq(A.isBlocked('myown0000001a'), false);
  });

  await t('W9 默认语义：拉黑瞬间清掉该用户的历史消息 + 点播卡片', async () => {
    eq(A.store.conf.keepHistory, false, 'v0.2.1 起默认「拉黑时清掉他的历史消息」');
    eq(A.store.conf.clearCards, true, '默认「清除历史点播卡片」为开');
    A.block(ID.OLD, '旧用户');
    A.block(ID.PMOLD, '私聊对象');
    await sleep(300);
    const h = document.getElementById('msgHolder');
    ok(!h.querySelector('[data-id^="' + ID.OLD + '"]'), '历史消息仍在: ' + h.innerHTML.slice(0, 150));
  });
  await t('W10 私聊会话项 [ip=被拉黑者] 被隐藏、他人不受影响', async () => {
    await sleep(300);
    eq(document.querySelector('[ip="' + ID.PMOLD + '"]').style.display, 'none');
    ok(document.querySelector('[ip="' + ID.KEEP + '"]').style.display !== 'none', '误伤正常联系人');
  });
  await t('W11 MutationObserver：新渲染的被拉黑消息被扫掉、他人保留', async () => {
    const h = document.getElementById('msgHolder');
    const bad = document.createElement('div');
    bad.className = 'msg'; bad.dataset.id = ID.BLOCK + '_1700009999';
    bad.innerHTML = '<div class="wrap"><div class="msgavatar" data-uid="' + ID.BLOCK + '"></div>blocked!</div>';
    const good = document.createElement('div');
    good.className = 'msg'; good.dataset.id = ID.OTHER + '_1700010000';
    good.innerHTML = '<div class="wrap"><div class="msgavatar" data-uid="' + ID.OTHER + '"></div>fine</div>';
    h.appendChild(bad); h.appendChild(good);
    await sleep(700);
    eq(h.querySelector('[data-id^="' + ID.BLOCK + '"]'), null, '新消息没扫掉');
    ok(h.querySelector('[data-id^="' + ID.OTHER + '"]'), '正常消息被误删');
  });
  await t('W12 系统消息（非 .msg 结构）整行删掉', async () => {
    const h = document.getElementById('msgHolder');
    const sys = document.createElement('div');
    sys.className = 'pubMsgSystem';
    sys.innerHTML = '<div><div data-uid="' + ID.BLOCK + '">系统提示：乙进入房间</div></div>';
    h.appendChild(sys);
    await sleep(500);
    ok(!h.contains(sys), '系统提示没删掉');
  });
  await t('W13 统计计数在涨', () => {
    const c = A.store.counters;
    ok(c.room >= 1 && c.priv >= 1 && c.danmaku >= 1 && c.dom >= 2, JSON.stringify(c));
  });
  await t('W14 名单落盘到 localStorage（刷新后仍生效）', () => {
    const raw = JSON.parse(localStorage.getItem('iirose_blacklist_v1') || '{}');
    ok(raw.uids && raw.uids[ID.BLOCK], '未落盘');
    eq(raw.uids[ID.BLOCK].name, '乙');
  });
  await t('W15 seen 里不该出现自己，别人要记录', () => {
    window.__RECV.length = 0;
    window.socket._onmessage('"1700000010>http://av/9.jpg>我>me>040b02>040b02>1>>myown0000001a>g>999');
    ok(!A.store.seen['myown0000001a'], '自己进了 seen');
    ok(A.store.seen[ID.BLOCK] || A.store.seen[ID.OTHER], '别人没进 seen');
  });

  await t('W16 面板：悬浮球点开、名单条数、见到的名字带 uid', async () => {
    const fab = innermost((e) => e.textContent === '🚫' && !e.querySelector('div'));
    ok(fab, '找不到悬浮球');
    fab.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
    document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await sleep(80);
    const p = panel();
    ok(p, '面板没打开');
    eq(p.style.display, 'flex');
    eq(innermost((e) => /^已拉黑 \(\d+\)$/.test(e.textContent || '')).textContent, '已拉黑 (3)', '名单条数不对：' + p.textContent.slice(0, 200));
    ok(p.textContent.indexOf(ID.OLD) > 0 || p.textContent.indexOf(ID.BLOCK) > 0, '名单没显示 uid');
  });
  await t('W17 面板点「解除」：被点的那条真的解除，私聊会话项随之恢复', async () => {
    const p = panel();
    const btn = innermost((e) => e.tagName === 'BUTTON' && e.textContent === '解除');
    ok(btn, '没有解除按钮');
    // 从该行文本里取出 uid（uid 可能含下划线，所以按"出现在名单里"匹配）
    const rowText = btn.parentElement.textContent;
    const uid = Object.keys(A.store.uids).find((u) => rowText.indexOf(u) >= 0);
    ok(uid, '没从行里认出 uid：' + rowText);
    const before = Object.keys(A.store.uids).length;
    btn.click();
    await sleep(250);
    eq(A.isBlocked(uid), false, '点了解除但 ' + uid + ' 还在名单');
    eq(Object.keys(A.store.uids).length, before - 1, '名单条数没减');
    await sleep(250);
    const sess = document.querySelector('[ip="' + uid + '"]');
    if (sess) eq(sess.style.display, '', '被解除的私聊会话项没恢复显示');
  });
  await t('W18 面板按名字拉黑', async () => {
    const p = panel();
    const input = p.querySelector('input[placeholder]');
    const btn = Array.from(p.querySelectorAll('button')).find((b) => b.textContent === '拉黑');
    input.value = '甲';
    btn.click();
    await sleep(120);
    eq(A.isBlocked(ID.OTHER), true, '按名字没能拉黑：' + p.textContent.slice(0, 200));
  });
  await t('W19 拉黑只走面板：右键/长按消息头像都不该再弹任何菜单（v0.2.4 起入口已移除）', async () => {
    const h = document.getElementById('msgHolder');
    const node = document.createElement('div');
    node.className = 'msg'; node.dataset.id = ID.RIGHT + '_1700008888';
    node.innerHTML = '<div class="wrap"><div class="msgavatar" data-uid="' + ID.RIGHT + '"></div>右键我</div>';
    h.appendChild(node);
    const av = node.querySelector('.msgavatar');
    // 右键
    av.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 120, clientY: 120 }));
    await sleep(80);
    // 触屏长按
    av.dispatchEvent(new PointerEvent('pointerdown', {
      bubbles: true, cancelable: true, pointerId: 1, pointerType: 'touch', isPrimary: true, clientX: 120, clientY: 120,
    }));
    await sleep(700);
    const menus = Array.from(document.querySelectorAll('div')).filter((e) => e.parentElement === document.body
      && e.style.position === 'fixed' && /^(拉黑 |解除拉黑 )/.test(e.textContent || ''));
    eq(menus.length, 0, '还弹出了拉黑菜单：' + menus.map((m) => m.textContent).join('|'));
    eq(A.isBlocked(ID.RIGHT), false, '光右键/长按不该把人拉黑');
    // 面板（贴 UID 点「拉黑」）才是唯一入口 —— 这条不能坏
    const p = panel();
    ok(p, '面板没打开');
    const input = p.querySelector('input');
    ok(input, '找不到 UID 输入框');
    input.value = ID.RIGHT;
    const addBtn = Array.from(p.querySelectorAll('button')).find((b) => b.textContent === '拉黑');
    ok(addBtn, '找不到「拉黑」按钮');
    realClick(addBtn);
    await sleep(150);
    ok(A.isBlocked(ID.RIGHT), '面板里贴 UID 点拉黑没生效（这是现在唯一的入口，不能坏）');
    A.unblock(ID.RIGHT);
    await sleep(60);
    if (node.parentNode) node.parentNode.removeChild(node);
  });

  await t('W20 dumpDom 探针可用（真机排障用）', () => {
    const d = A.dumpDom();
    eq(d.version, A.version); eq(d.msgholderBox, true); eq(d.myUid, 'myown0000001a');
    ok(Array.isArray(d.blacklist) && d.blacklist.length >= 1, 'blacklist: ' + JSON.stringify(d.blacklist));
  });
  await t('W21 总开关关闭后所有帧都放行、DOM 也不再删', async () => {
    A.store.enabled = false;
    window.__RECV.length = 0; window.socket._onmessage(F.priv2); eq(window.__RECV[0], F.priv2);
    const h = document.getElementById('msgHolder');
    const n = document.createElement('div');
    n.className = 'msg'; n.dataset.id = ID.BLOCK + '_1700020000';
    n.innerHTML = '<div class="msgavatar" data-uid="' + ID.BLOCK + '"></div>x';
    h.appendChild(n);
    await sleep(500);
    ok(h.contains(n), '关闭开关后仍被删');
    A.store.enabled = true;
  });

  await t('W22 收包过滤被站点重建后会自己挂回来（模拟重连）', async () => {
    // 站点重连时会把 _onmessage 换成新函数，标记随之消失
    window.socket._onmessage = function (d) { window.__RECV.push(d); };
    eq(A.hooked, false, 'hooked 应实时反映"没挂上"');
    await sleep(6000);                                   // 5 秒自检周期
    eq(A.hooked, true, '自检应把过滤重新挂回新 socket');

    try {
      A.blockRoom('dd1e2f3a4b5c', '大写 id 的房间');
      await sleep(200);
      eq(upper.style.display, 'none', '名单小写、卡片大写 → 没命中（大小写没归一）');
      eq(empty.style.display, '', '空 rid 的卡片被动了（应原样不动）');
    } finally {
      A.unblockRoom('DD1E2F3A4B5C');
      A.sweep();
    }
    await sleep(150);
    eq(upper.style.display, '', '解除后大写卡片没还原');
  });

  await t('W63 节点复用：卡片 detach→attach 仍隐藏；站点改写 rid 后要立刻按新 rid 判定（不再等 5 秒）', async () => {
    const A = window.__IIROSE_BLACKLIST__;
    A.setEnabled(true);
    const box = document.getElementById('roomListBox');
    const a = roomCard(RID_A);
    try {
      A.blockRoom(RID_A, '吵闹的房间');
      await sleep(150);
      box.removeChild(a);
      box.appendChild(a);
      await sleep(250);
      eq(a.style.display, 'none', 'detach/attach 后没保持隐藏');

      a.setAttribute('rid', RID_C);       // 站点把这张卡复用成另一个房间
      await sleep(250);
      eq(a.style.display, '', 'rid 被改写后没立刻放开（多了一屏错误隐藏窗口）');
      a.setAttribute('rid', RID_A);
      await sleep(250);
      eq(a.style.display, 'none', 'rid 改回被屏蔽的房间后没立刻隐藏');
    } finally {
      a.setAttribute('rid', RID_A);
      A.unblockRoom(RID_A);
    }
  });

  await t('W64 排障出口：_diag.rooms() 报告卡片数/逐条状态，_diag.sweepRooms() 返回隐藏数；面板提示行显示识别到的卡片数', async () => {
    const A = window.__IIROSE_BLACKLIST__;
    A.setEnabled(true);
    A.sweep();
    await sleep(150);
    const d = A._diag.rooms();
    eq(d.cardCount >= 3, true, 'cardCount 少于夹具里的房间卡片数：' + d.cardCount);
    eq(d.rows.length, d.cardCount, 'rows 与 cardCount 不一致');
    eq(d.orphans.length, 0, '不该有孤儿节点：' + JSON.stringify(d.orphans));
    eq(typeof A._diag.sweepRooms(), 'number', 'sweepRooms 应返回隐藏张数');
    try {
      A.blockRoom('dd1e2f3a4b5c', '大写 id 的房间');
      await sleep(150);
      const hit = A._diag.rooms().rows.filter((r) => String(r.rid).toLowerCase() === 'dd1e2f3a4b5c')[0];
      ok(hit, '_diag.rooms() 里找不到被屏蔽的那张卡');
      eq(hit.hit, true, 'diag 没标出命中');
      eq(hit.hidden, true, 'diag 没标出已隐藏');
      eq(hit.display, 'none', 'diag 报的 display 与实际不符');
    } finally { A.unblockRoom('DD1E2F3A4B5C'); }
    const p = await ensurePanel();
    await sleep(150);
    ok(/识别到 \d+ 张房间卡片/.test(p.textContent || ''), '面板提示行没显示"识别到 N 张房间卡片"：' + (p.textContent || '').slice(0, 120));
  });

  await t('W65 解除屏蔽后，该房间要回到面板「最近出现的房间」列表里（用户据此判断解除成功）', async () => {
    const A = window.__IIROSE_BLACKLIST__;
    A.setEnabled(true);
    const p = await ensurePanel();
    ok(A.store.rooms[RID_B], '前置：RID_B 应已被采集');
    // 只看「最近出现」那一列（按钮文案是「屏蔽」）—— 屏蔽后它还会出现在「已屏蔽房间」列（按钮是「解除」）
    const seenRow = () => Array.from(p.querySelectorAll('div'))
      .filter((d) => d.querySelector && d.querySelector('button') && (d.textContent || '').indexOf(RID_B) >= 0)
      .filter((d) => ((d.querySelector('button').textContent || '').trim()) === '屏蔽').pop() || null;
    try {
      A.blockRoom(RID_B, '安静的房间');
      await sleep(200);
      eq(seenRow(), null, '已屏蔽的房间还留在「最近出现的房间」列表里');
    } finally {
      A.unblockRoom(RID_B);
    }
    await sleep(200);
    ok(seenRow(), '解除后该房间没回到「最近出现的房间」列表');
  });

  const tabBtn = (root, pre) => Array.from(root.querySelectorAll('button'))
    .find((b) => (b.textContent || '').indexOf(pre) === 0) || null;
  const vis = (el) => !!(el && el.getBoundingClientRect().width > 0 && el.getBoundingClientRect().height > 0);

  await t('W66 面板改名区：两个 tab 并排、列表组跟着 tab 切、两个输入框上下排', async () => {
    const A = window.__IIROSE_BLACKLIST__;
    const p = await ensurePanel();
    ok(p, '面板没打开');
    const tU = tabBtn(p, '已拉黑用户'), tR = tabBtn(p, '已屏蔽房间');
    ok(tU && tR, '找不到「已拉黑用户 / 已屏蔽房间」两个 tab 按钮');
    const ru = tU.getBoundingClientRect(), rr = tR.getBoundingClientRect();
    eq(Math.abs(ru.top - rr.top) < 2, true, '两个 tab 没并排（top 差 ' + Math.abs(ru.top - rr.top) + '）');
    eq(rr.left > ru.left, true, '「已屏蔽房间」应该在右边');
    const iu = p.querySelector('input[placeholder*="uid"]'), ir = p.querySelector('input[placeholder*="房间 id"]');
    ok(iu && ir, '两个输入框不都在面板里');
    eq(ir.getBoundingClientRect().top > iu.getBoundingClientRect().top, true, '两个输入框没做成上下排');
    // 组标题（纯文本 div）跟着 tab 显隐
    const head = (pre) => Array.from(p.querySelectorAll('div'))
      .find((d) => !d.children.length && (d.textContent || '').indexOf(pre) === 0) || null;
    const hBl = head('已拉黑 ('), hRoom = head('已屏蔽房间 (');
    ok(hBl && hRoom, '找不到两组的标题行');
    try {
      realClick(tR); await sleep(200);
      eq(A.store.conf.tab, 'rooms', '切到房间 tab 后没落盘');
      eq(vis(hRoom), true, '房间 tab 下「已屏蔽房间」一组没显示');
      eq(vis(hBl), false, '房间 tab 下「已拉黑」一组还露着');
      realClick(tU); await sleep(200);
      eq(A.store.conf.tab, 'users', '切回用户 tab 后没落盘');
      eq(vis(hBl), true, '用户 tab 下「已拉黑」一组没显示');
      eq(vis(hRoom), false, '用户 tab 下「已屏蔽房间」一组还露着');
      // 没选中的那组里的按钮不该被自检算成"点不到"（inHiddenBox 过滤）
      const invis = A._diag.hitTest().filter((x) => !x.visible);
      eq(invis.length <= 1, true, '隐藏组里的控件被算进"点不到"：'
        + JSON.stringify(invis.map((x) => x.what).slice(0, 6)));
    } finally {
      realClick(tU); await sleep(150);
    }
  });

  await t('W67 动作带着 tab 走：屏蔽房间 → 自动切房间组；拉黑 → 自动切回用户组', async () => {
    const A = window.__IIROSE_BLACKLIST__;
    A.setEnabled(true);
    const p = await ensurePanel();
    const tU = tabBtn(p, '已拉黑用户'), tR = tabBtn(p, '已屏蔽房间');
    ok(tU && tR, '找不到两个 tab 按钮');
    const U = 'tab0000000001';                     // 本用例专用，避免撞上别的用例已经拉黑的 uid
    if (A.isBlocked(U)) A.unblock(U);
    try {
      realClick(tU); await sleep(150);
      A.blockRoom(RID_C, '第三个房间');
      await sleep(200);
      eq(A.store.conf.tab, 'rooms', '屏蔽房间后没自动切到房间组');
      eq(vis(tabBtn(p, '已屏蔽房间')), true, 'tab 按钮消失了');
      A.block(U, '临时用户');
      eq(A.isBlocked(U), true, '前置：这个 uid 应该拉黑成功（否则后面的断言看不出是切 tab 的问题）');
      await sleep(200);
      eq(A.store.conf.tab, 'users', '拉黑后没自动切回用户组');
    } finally {
      A.unblockRoom(RID_C); A.unblock(U);
      realClick(tU); await sleep(150);
    }
  });

  const fail = results.filter((r) => !r.ok);
  const summary = { total: results.length, pass: results.length - fail.length, fail: fail.length, results };
  window.__RESULT__ = summary;
  // 存一份到 localStorage：CDP 会话或标签页中途掉线时，重开本页即可读回结果（键名固定，别删）
  try { localStorage.setItem('bl_harness_result', JSON.stringify({ when: new Date().toISOString(), href: location.href, summary: summary })); } catch (e) { }
  document.getElementById('out').textContent = JSON.stringify(summary, null, 1);
  document.getElementById('box').textContent = 'harness 完成：通过 ' + summary.pass + '/' + summary.total;
}

window.addEventListener('load', () => { run().catch((e) => { document.getElementById('out').textContent = 'runner 崩溃: ' + (e && e.stack || e); }); });
</script>
</body>
</html>
