<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>复现：iframe 被父页面覆盖层挡住 → 面板看得见、点不动</title>
<style>
  body { margin: 0; font: 13px/1.6 "Microsoft YaHei", sans-serif; background: #111; color: #ddd; }
  #wrap { position: relative; width: 1000px; height: 620px; margin: 12px; }
  iframe { width: 100%; height: 100%; border: 1px solid #444; background: #1e1f26; }
  /* 父页面层的透明覆盖层：盖住"面板默认位置的上半部分"（也就是开关那几行所在区域），
     但不盖悬浮球所在的位置 —— 真机现象就是：悬浮球点得动（面板能打开），开关点不动。
     它不改变视觉，却会接走这一区域的点击；iframe 内部的 elementFromPoint 看不见它。 */
  #cover { position: absolute; left: 580px; top: 60px; width: 420px; height: 280px; background: rgba(255,0,0,0.06); z-index: 999999; }
  #cover.none { display: none; }
  #bar { margin: 12px; }
  button { font: inherit; padding: 4px 10px; }
  #out { margin: 12px; color: #9ad; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar">
  <button id="toggleCover">隐藏/显示覆盖层</button>
  <span id="hint">覆盖层：显示中（右下角 420×560 区域内，iframe 里的面板点不动）</span>
</div>
<div id="wrap">
  <iframe id="f" src="child.html"></iframe>
  <div id="cover"></div>
</div>
<div id="out">（等 iframe 里的插件加载）</div>
<script>
  const f = document.getElementById('f'), cover = document.getElementById('cover');
  document.getElementById('toggleCover').onclick = () => {
    cover.classList.toggle('none');
    document.getElementById('hint').textContent = '覆盖层：' + (cover.classList.contains('none') ? '已隐藏' : '显示中（右下角 420×560 区域内，iframe 里的面板点不动）');
  };
  // 把 iframe 内插件的排障结果读出来（同源）
  window.readChild = () => f.contentWindow.__IIROSE_BLACKLIST__;
  setInterval(() => {
    const A = f.contentWindow.__IIROSE_BLACKLIST__;
    document.getElementById('out').textContent = A
      ? '子页插件 v' + A.version + '｜hooked=' + A.hooked + '｜自检：' + (A._diag.selfCheck().line || '')
      : '（等 iframe 里的插件加载）';
  }, 1000);
</script>
</body>
</html>
