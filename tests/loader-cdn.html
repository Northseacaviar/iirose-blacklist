<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>loader 验收 · 朋友路径（CDN 实链）</title>
<style>body{background:#111;color:#ddd;font:13px/1.7 monospace;padding:16px} .ok{color:#68b26d} .bad{color:#ec4141}</style>
</head>
<body>
<div id="out">跑中…</div>
<script>
  // 完全按朋友的用法：只注入这行地址（就是 extJs 里那一行）
  window.__LOADER_URL__ = 'https://cdn.jsdelivr.net/gh/Northseacaviar/iirose-blacklist/loader.js';
  var s = document.createElement('script');
  s.src = window.__LOADER_URL__;
  document.head.appendChild(s);
</script>
<script>
(async function () {
  const lines = []; let fail = 0;
  const ok = (c, m) => { lines.push((c ? '<span class="ok">ok   </span>' : '<span class="bad">FAIL </span>') + m); if (!c) fail++; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 120 && !window.__IIROSE_BLACKLIST__; i++) await wait(100);
  const A = window.__IIROSE_BLACKLIST__;
  ok(!!A, 'CDN 上的 loader 成功把插件拉起来（朋友路径）');
  if (A) {
    ok(A.version === '0.2.0', '版本 = ' + A.version + '（应是仓库当前最新）');
    ok(A.storage().mode === 'local', '注入形态下存储 = local，自检行会写明：' + A.storage().label);
    const srcs = [].slice.call(document.getElementsByTagName('script')).map((x) => x.src);
    const main = srcs.filter((u) => /iirose-blacklist\.js\?t=\d+$/.test(u))[0];
    ok(!!main && /cdn\.jsdelivr\.net/.test(main), '主脚本走 CDN + 时间戳绕缓存：' + (main || '没找到'));
  }
  document.getElementById('out').innerHTML = lines.join('<br>') + '<br><br><b>' + (fail ? ('失败 ' + fail + ' 项') : '全部通过') + '</b>';
  window.__RESULT__ = { total: lines.length, fail: fail };
})();
</script>
</body>
</html>
