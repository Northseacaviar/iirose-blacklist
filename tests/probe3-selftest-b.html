<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>探针3 自测B：探针先跑、插件后到</title></head>
<body>
<div id="out">跑中…</div>
<script>
window.__RECV = [];
window.socket = { _onmessage: function (d) { window.__RECV.push(d); }, send: function () { }, readState: 1 };
</script>
<!-- 先装探针，再加载插件：验证探针不会把插件的钩子挡掉 -->
<script src="../docs/探针-信箱3-真帧.js"></script>
<script src="../src/iirose-blacklist.js"></script>
<script>
(async function () {
  const lines = []; let fail = 0;
  const ok = (c, m) => { lines.push((c ? 'ok   ' : 'FAIL ') + m); if (!c) fail++; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    for (let i = 0; i < 40 && !(window.__MAIL3__ && window.__MAIL3__.hooked); i++) await wait(200);
    ok(window.__MAIL3__.hooked === 1, '探针在插件后到的情况下仍然挂上了收包');
    const A = window.__IIROSE_BLACKLIST__;
    ok(!!A && A.hooked === true, '插件照常挂上了（探针没把它挡掉）');
    A.block('5e8f28b7a7b55', 'Night cruise');
    await wait(200);
    const like = "@*Night cruise>http://r.iirose.com/i/x.png>1>'*>http://img/bg.png>1790389464>d6122a";
    window.__RECV.length = 0; window.socket._onmessage(like);
    ok(window.__RECV.length === 0, '点赞记录仍被插件丢掉（探针在外层也照常拦）');
    const fr = window.__MAIL3__.frames.filter((x) => x.p === '@');
    ok(fr.length >= 1 && fr[fr.length - 1].verdicts[0].wouldBlock === true, '探针同时拿到了原始帧与"该拦"的判定');
    // 插件内部重挂时可能短暂包在探针外面（无害：探针那层仍在链上，照样记帧）。
    // 真正要保证的性质是"这一层还在链上、还在记帧"，所以直接再喂一帧验证。
    let back = false;
    for (let i = 0; i < 12 && !back; i++) { back = window.socket._onmessage.__mail3 === true; if (!back) await wait(300); }
    lines.push('info 探针是否位于最外层：' + (back ? '是' : '否（探针层在链上，记帧不受影响）'));
    const n0 = window.__MAIL3__.frames.length;
    window.socket._onmessage(like);
    ok(window.__MAIL3__.frames.length > n0, '插件重挂之后探针仍在记帧（链上有一层是探针的）');
  } catch (e) {
    document.getElementById('out').innerHTML = lines.join('<br>') + '<br><b style="color:#ec4141">抛异常：' + e.message + '</b>';
    window.__RESULT__ = { fail: fail + 1, error: String(e.message) }; return;
  }
  document.getElementById('out').innerHTML = lines.join('<br>') + '<br><br><b>' + (fail ? ('失败 ' + fail + ' 项') : '全部通过') + '</b>';
  window.__RESULT__ = { total: lines.length, fail: fail };
})();
</script>
</body>
</html>
