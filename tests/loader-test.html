<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>loader 验收（本地路径 + CDN 路径）</title>
<style>body{background:#111;color:#ddd;font:13px/1.7 monospace;padding:16px} .ok{color:#68b26d} .bad{color:#ec4141} .dim{color:#888}</style>
</head>
<body>
<div id="out">跑中…</div>
<script>
  window.__LINES__ = []; window.__FAIL__ = 0;
  function ok(cond, msg) {
    window.__LINES__.push((cond ? '<span class="ok">ok   </span>' : '<span class="bad">FAIL </span>') + msg);
    if (!cond) window.__FAIL__++;
  }
  function report() {
    document.getElementById('out').innerHTML = window.__LINES__.join('<br>')
      + '<br><br><b>' + (window.__FAIL__ ? ('失败 ' + window.__FAIL__ + ' 项') : '全部通过') + '</b>';
    window.__RESULT__ = { total: window.__LINES__.length, fail: window.__FAIL__ };
  }
</script>

<!-- 方式一：相对路径加载（本地 = 与 CDN 同构：loader 自己取自己的目录） -->
<script src="../loader.js"></script>

<script>
(async function () {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // loader 是异步注入主脚本的，等它挂上
  for (let i = 0; i < 80 && !window.__IIROSE_BLACKLIST__; i++) await wait(100);
  const A = window.__IIROSE_BLACKLIST__;
  ok(!!A, 'loader 相对路径加载成功，插件已就绪');
  if (A) {
    ok(A.version === '0.2.0', '拿到的版本 = ' + A.version + '（与仓库根发布件一致）');
    ok(A.storage().mode === 'local', '注入形态下存储 = local');
    A.block('loadertest01', 'loader 测试');
    await wait(500);
    ok(!!localStorage.getItem('iirose_blacklist_v1'), '拉黑后名单真的落到了 localStorage');
    A.unblock('loadertest01');
    // 主脚本是通过带 ?t= 的地址注入的（绕缓存）
    const srcs = [].slice.call(document.getElementsByTagName('script')).map((s) => s.src);
    const main = srcs.filter((u) => /iirose-blacklist\.js\?t=\d+$/.test(u));
    ok(main.length === 1, '主脚本是用带时间戳的地址注入的（绕开 7 天缓存）：' + (main[0] || '没找到'));
  }

  // 幂等：再插一次 loader，不该再拉一份主脚本
  const before = [].slice.call(document.getElementsByTagName('script')).filter((s) => /iirose-blacklist\.js/.test(s.src)).length;
  const again = document.createElement('script');
  again.src = '../loader.js?again=1';
  document.head.appendChild(again);
  await wait(1200);
  const after = [].slice.call(document.getElementsByTagName('script')).filter((s) => /iirose-blacklist\.js/.test(s.src)).length;
  ok(after === before, '重复注入 loader 不再拉主脚本（' + before + ' → ' + after + '）');

  report();
})();
</script>
</body>
</html>
